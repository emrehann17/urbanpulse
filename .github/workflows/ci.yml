name: Python quality
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: ./.venv-ci/bin/python
          - os: windows-latest
            python: ./.venv-ci/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Create isolated environment
        run: python -m venv .venv-ci
      - name: Verify interpreter isolation
        run: ${{ matrix.python }} -c "import sys, site; assert sys.prefix != sys.base_prefix; assert not site.ENABLE_USER_SITE; print(sys.executable)"
      - run: ${{ matrix.python }} -m pip install -r requirements-dev.txt
      - run: ${{ matrix.python }} -m pip check
      - run: ${{ matrix.python }} -m ruff check .
      - run: ${{ matrix.python }} -m ruff format --check .
      - run: ${{ matrix.python }} -m pytest -q
